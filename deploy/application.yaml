apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barbican-proxy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: barbican-proxy

  source:
    repoURL: "https://github.com/Mobility-Scooter-Project/mobility-scooter-infra.git"
    targetRevision: main
    path: charts/api
    helm:
      values: |
        name: barbican-proxy
        replicas: 1

        image:
          repository: ghcr.io/mobility-scooter-project/barbican-proxy/barbican-proxy
          tag: sarina-development
          pullPolicy: IfNotPresent

        service:
          port: 8080
          targetPort: 3000

        ingress:
          enabled: false

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        
        # this part I am confused on
        envFrom:
          - secretRef:
              name: barbican-proxy-secrets

        kv:
          enabled: false
        database:
          enabled: false
        queue:
          enabled: false

  syncPolicy:
    # automated:
    # prune: true
    #selfHeal: true
    syncOptions:
      - CreateNamespace=true