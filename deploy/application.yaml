apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barbican-proxy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: barbican-proxy

  sources:
    - repoURL: "https://github.com/Mobility-Scooter-Project/mobility-scooter-infra.git"
      targetRevision: main
      path: charts/api
      helm:
        values: |
          name: barbican-proxy
          replicas: 1

          image:
            repository: ghcr.io/mobility-scooter-project/barbican-proxy/barbican-proxy
            tag: sarina-development
            pullPolicy: IfNotPresent

          service:
            port: 3000
            targetPort: 3000

          ingress:
            enabled: false

          resources:
            requests:
              cpu: "100m"      
              memory: "128Mi"  
            limits:
              cpu: "500m"     
              memory: "512Mi"  

          database:
            enabled: false
            shouldMigrate: false

          kv:
            enabled: true
            connectionStringEnvVarName: "KV_URL"

          env:
            OS_AUTH_URL: "https://js2.jetstream-cloud.org:5000/v3/"
            BARBICAN_URL: "https://js2.jetstream-cloud.org:9311"
   
            OS_APPLICATION_CREDENTIAL_CLIENT_ID: "a017bf17b9ab4a8097ef311eb3defd63"
            OS_APPLICATION_CREDENTIAL_CLIENT_SECRET: "fmApR5i62JNZYH_vp41oRwPPaYIeUOBDKEFOP3NlRfLltYgSqHNZPxI7BcV0HWGyRzbglurhdpNfngCOgcTjuw"

            KV_URL: "redis://localhost:6379"

  syncPolicy:
    #automated:
      #prune: true     
      #selfHeal: true   
    syncOptions:
      - CreateNamespace=true