apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barbican-proxy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: barbican-proxy

  sources:
    - repoURL: "https://github.com/Mobility-Scooter-Project/mobility-scooter-infra.git"
      targetRevision: main
      path: charts/api
      helm:
        values: |
          name: barbican-proxy
          replicas: 1

          image:
            repository: ghcr.io/mobility-scooter-project/barbican-proxy
            tag: latest
            pullPolicy: IfNotPresent

          imagePullSecrets:
            - name: ghcr-secret

          service:
            port: 3000
            targetPort: 3000

          ingress:
            enabled: false

          resources:
            requests:
              cpu: "100m"   
              memory: "128Mi"  
            limits:
              cpu: "500m"      
              memory: "512Mi"  

          database:
            enabled: false
            shouldMigrate: false

          kv:
            enabled: true
            connectionStringEnvVarName: "KV_URL"

          queue:
            enabled: false

          env:
            OS_AUTH_URL: "https://js2.jetstream-cloud.org:5000/v3/"
            BARBICAN_URL: "https://js2.jetstream-cloud.org:9311"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true